 theme = "onedarker"

[editor]
mouse = false
default-yank-register = "+" # Yank to system clipboard

[editor.statusline]
left = ["mode", "spinner", "register"]
center = ["version-control", "file-name"]
right = ["diagnostics", "selections", "position", "file-encoding", "file-type"]
separator = "│"
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"
diagnostics = ["warning", "error"]
workspace-diagnostics = ["warning", "error"]

[editor.file-picker]
hidden = false

