# Unbind the default reload key and rebind it to reload this config file.
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# Use vi-style key bindings in copy mode (e.g. hjkl navigation, v to select).
set-window-option -g mode-keys vi

# Switch panes with prefix+H/J/K/L (vim-style directions).
bind H select-pane -L
bind J select-pane -D
bind K select-pane -U
bind L select-pane -R

# Replace the default Ctrl+B prefix with Ctrl+Space.
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Keep a large scrollback buffer (number of lines retained per pane).
set -g history-limit 100000

# Enable mouse support: click to select panes/windows, scroll to navigate history.
set -g mouse on

# Number windows and panes starting at 1 instead of 0 (easier keyboard reach).
set -g base-index 1
setw -g pane-base-index 1

# After closing a window, close the gap by renumbering subsequent windows.
set-option -g renumber-windows on

# Prevent tmux from overwriting the window name with the running command.
set-option -g allow-rename off

# --- Catppuccin theme ---
# Select the Catppuccin color palette variant (latte / frappe / macchiato / mocha).
set -g @catppuccin_flavor 'mocha'

# Show only the window name (no extra decorations) for inactive and active windows.
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# Load the Catppuccin theme plugin (must run before any status-line overrides below).
run ~/.config/tmux/plugins/catppuccin/catppuccin.tmux

# --- Status line ---
# Clear the left side of the status bar (the theme already populates it).
set -g status-left ""

# Right side: show the current session name with Catppuccin teal/crust colors.
set -g status-right '#[fg=#{@thm_crust},bg=#{@thm_teal}] session: #S '

# Allow the right status string to be up to 100 characters wide so it is never truncated.
set -g status-right-length 100
